<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Slide 1 - Hero Cover</title>
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&amp;family=Space+Grotesk:wght@500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet"/>
<style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0A0F1E;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            width: 1080px;
            height: 1080px;
        }

        .slide-container {
            width: 1080px;
            height: 1080px;
            position: relative;
            background-color: #0A0F1E;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }

        /* Abstract Grid Background */
        .bg-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            z-index: 0;
        }

        .content-wrapper {
            position: relative;
            z-index: 10;
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 60px 80px;
        }

        .tag-badge {
            display: inline-flex;
            align-items: center;
            border: 2px solid #00F0FF;
            color: #00F0FF;
            padding: 8px 24px;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 18px;
            letter-spacing: 2px;
            text-transform: uppercase;
            align-self: flex-start;
            margin-bottom: 60px;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
        }

        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 110px;
            line-height: 1.1;
            font-weight: 700;
            color: white;
            margin: 0;
            margin-bottom: 40px;
            text-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .highlight-text {
            color: #FF2D2D;
            display: inline-block;
            position: relative;
        }

        .sub-headline {
            font-size: 36px;
            line-height: 1.4;
            color: #E2E8F0;
            max-width: 900px;
            font-weight: 400;
            border-left: 6px solid #FF2D2D;
            padding-left: 30px;
        }

        /* Crumbling Wall Visual */
        .visual-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            margin-top: 40px;
        }

        .wall-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 8px;
            width: 600px;
            height: 300px;
            position: relative;
        }

        .brick {
            background-color: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            height: 60px;
        }

        .brick.secure {
            background-color: rgba(0, 240, 255, 0.15);
            border-color: #00F0FF;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
        }
        
        .brick.breached {
            background-color: rgba(255, 45, 45, 0.2);
            border-color: #FF2D2D;
            position: relative;
            transform: rotate(15deg) translateY(20px);
            opacity: 0.8;
            box-shadow: 0 0 15px rgba(255, 45, 45, 0.4);
        }

        .brick.missing {
            background: transparent;
            border: none;
        }
        
        .brick.falling {
            background-color: #FF2D2D;
            position: absolute;
            width: 65px; 
            height: 60px;
            bottom: -80px;
            left: 40%;
            transform: rotate(-25deg);
            opacity: 0.9;
        }

        .brick.falling-2 {
            background-color: #FF2D2D;
            position: absolute;
            width: 65px; 
            height: 60px;
            bottom: -120px;
            left: 55%;
            transform: rotate(45deg);
            opacity: 0.7;
        }

        .lock-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 140px;
            color: #FF2D2D;
            z-index: 20;
            background-color: #0A0F1E;
            padding: 20px;
            border-radius: 50%;
            border: 4px solid #FF2D2D;
            box-shadow: 0 0 30px rgba(255, 45, 45, 0.5);
        }

        /* Footer */
        .footer-bar {
            background-color: #FF2D2D;
            padding: 30px 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 20;
        }

        .footer-text {
            color: #FFFFFF;
            font-weight: 700;
            font-size: 28px;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .arrow-icon {
            animation: bounceRight 1.5s infinite;
        }

        @keyframes bounceRight {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(10px); }
        }

        .page-number {
            color: rgba(255, 255, 255, 0.8);
            font-family: 'Space Grotesk', sans-serif;
            font-size: 24px;
        }
    </style>
</head>
<body>
<div class="slide-container">
<!-- Background Grid -->
<div class="bg-grid"></div>
<!-- Main Content -->
<div class="content-wrapper">
<!-- Label -->
<div>
<div class="tag-badge">
<i class="fas fa-shield-halved" style="margin-right: 12px;"></i>
                    AI SECURITY
                </div>
</div>
<!-- Headline -->
<h1>
                Building an <br/>
<span class="highlight-text">AI Agent?</span>
</h1>
<!-- Sub-headline -->
<div class="sub-headline">
<p>Why input filters, jailbreak detectors, and deny-lists are failing to stop the next wave of cyber attacks.</p>
</div>
<!-- Visual: Crumbling Firewall -->
<div class="visual-container">
<div class="wall-grid">
<!-- Row 1 -->
<div class="brick secure"></div><div class="brick secure"></div><div class="brick secure"></div><div class="brick secure"></div><div class="brick secure"></div><div class="brick secure"></div><div class="brick secure"></div><div class="brick secure"></div>
<!-- Row 2 -->
<div class="brick secure"></div><div class="brick secure"></div><div class="brick breached"></div><div class="brick missing"></div><div class="brick missing"></div><div class="brick breached"></div><div class="brick secure"></div><div class="brick secure"></div>
<!-- Row 3 -->
<div class="brick secure"></div><div class="brick breached"></div><div class="brick missing"></div><div class="brick missing"></div><div class="brick missing"></div><div class="brick missing"></div><div class="brick breached"></div><div class="brick secure"></div>
<!-- Row 4 -->
<div class="brick secure"></div><div class="brick secure"></div><div class="brick breached"></div><div class="brick missing"></div><div class="brick missing"></div><div class="brick breached"></div><div class="brick secure"></div><div class="brick secure"></div>
<!-- Falling Bricks -->
<div class="brick falling"></div>
<div class="brick falling-2"></div>
</div>
<!-- Broken Lock Overlay -->
<div class="lock-icon">
<i class="fas fa-lock-open"></i>
</div>
</div>
</div>
<!-- Footer CTA -->
<div class="footer-bar">
<div class="footer-text">
                Swipe to see the structural flaw in your AI architecture
                <i class="fas fa-arrow-right arrow-icon"></i>
</div>
<div class="page-number">01 / 07</div>
</div>
</div>
</body>
</html>
