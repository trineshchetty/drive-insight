# Grafana Agent Configuration
# Scrapes metrics from API and ships logs/metrics to Grafana Cloud

server:
  log_level: info

# Prometheus metrics scraping and remote-write
metrics:
  global:
    scrape_interval: 15s
    remote_write:
      - url: ${PROMETHEUS_REMOTE_WRITE_URL}
        basic_auth:
          username: ${PROMETHEUS_USERNAME}
          password: ${PROMETHEUS_PASSWORD}

  configs:
    - name: drive-insight-metrics
      scrape_configs:
        # Scrape API metrics endpoint
        - job_name: 'drive-insight-api'
          static_configs:
            - targets: ['api:3000']
          metrics_path: '/api/metrics'
          scrape_interval: 15s

